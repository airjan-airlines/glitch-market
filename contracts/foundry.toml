[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
base_sepolia_public = "https://sepolia.base.org"

[etherscan]
# Etherscan V2 is multichain on a single key; 84532 = Base Sepolia.
base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532, url = "https://api.etherscan.io/v2/api" }

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = true
